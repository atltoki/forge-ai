name: ATL DIRECTOR checks

on:
  push:
    branches:
      - fix/atl-director-orbit-priority-state
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atl-director-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript + Vitest + Node tests + Next build
        run: npm run check
